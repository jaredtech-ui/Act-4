<!DOCTYPE html>
<html>

<head>
    <title>Activity 4</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: black;
            color: gold;
            overflow-x: hidden;
        }

        /* Animated Pokémon-style background */
        body::before {
            content: "";
            position: fixed;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, red 0%, red 40%, white 41%, white 60%, black 61%);
            opacity: 0.05;
            animation: rotateBg 20s linear infinite;
            z-index: -1;
        }

        @keyframes rotateBg {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        h2 {
            text-align: center;
            font-size: 28px;
            animation: glow 1.5s ease-in-out infinite alternate;
        }

        /* Electric glow animation */
        @keyframes glow {
            from {
                text-shadow: 0 0 10px gold, 0 0 20px orange;
            }
            to {
                text-shadow: 0 0 20px yellow, 0 0 30px gold;
            }
        }

        table {
            margin: 40px auto;
            border-collapse: collapse;
            width: 50%;
            background-color: #111;
            border: 3px solid gold;
            animation: pulseBorder 2s infinite alternate;
        }

        /* Pulsing border like power-up */
        @keyframes pulseBorder {
            from { box-shadow: 0 0 10px gold; }
            to { box-shadow: 0 0 25px yellow; }
        }

        td {
            padding: 10px;
            border: 1px solid gold;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 95%;
            padding: 6px;
            background-color: black;
            color: gold;
            border: 1px solid gold;
        }

        input[type="radio"],
        input[type="checkbox"] {
            accent-color: gold;
        }

        input[type="submit"],
        input[type="reset"] {
            background-color: gold;
            color: black;
            border: none;
            padding: 8px 15px;
            margin: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        /* Button hover animation */
        input[type="submit"]:hover,
        input[type="reset"]:hover {
            background-color: yellow;
            box-shadow: 0 0 15px gold;
            transform: scale(1.1);
        }
    </style>
</head>

<body>

    <h2>⚡ User Information Form ⚡</h2>

    <form action="" method="post">
        <table>

            <tr>
                <td><label for="fname">First Name:</label></td>
                <td><input type="text" id="fname" name="firstname" required></td>
            </tr>

            <tr>
                <td><label for="lname">Last Name:</label></td>
                <td><input type="text" id="lname" name="lastname" required></td>
            </tr>

            <tr>
                <td><label for="age">Age:</label></td>
                <td><input type="number" id="age" name="age"></td>
            </tr>

            <tr>
                <td>Gender:</td>
                <td>
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>

                    <input type="radio" id="other" name="gender" value="other">
                    <label for="other">Other</label>
                </td>
            </tr>

            <tr>
                <td>Hobbies:</td>
                <td>
                    <input type="checkbox" id="hobby1" name="hobby[]" value="reading">
                    <label for="hobby1">Reading</label><br>

                    <input type="checkbox" id="hobby2" name="hobby[]" value="cycling">
                    <label for="hobby2">Cycling</label><br>

                    <input type="checkbox" id="hobby3" name="hobby[]" value="sleeping">
                    <label for="hobby3">Sleeping</label>
                </td>
            </tr>

            <tr>
                <td><label for="year-level">Year Level:</label></td>
                <td>
                    <select id="year-level" name="year-level">
                        <option value="first">1st Year</option>
                        <option value="second">2nd Year</option>
                        <option value="third">3rd Year</option>
                        <option value="fourth">4th Year</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Send Data">
                    <input type="reset" value="Reset">
                </td>
            </tr>

        </table>
    </form>

</body>
</html>
